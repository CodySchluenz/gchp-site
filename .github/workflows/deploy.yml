# Manual deploy to Cloudflare Pages, for when nobody is at a PC with wrangler.
# Pushing to main still does NOT deploy: this only runs when started by hand
# (Actions tab -> Deploy to Cloudflare Pages -> Run workflow), which keeps the
# golden rule from docs/managing-the-website.md intact: migrate BEFORE deploying.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Workers & Pages overview page
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Apply D1 migrations to the remote database first"
        type: boolean
        default: false

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Resolve account id
        # If CLOUDFLARE_ACCOUNT_ID isn't set as a secret, ask Cloudflare which
        # account the token belongs to (needs the token to see exactly one).
        run: |
          ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -z "$ID" ]; then
            ID=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          fi
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "Could not resolve account id"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          echo "Deploying to account $ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply migrations (optional)
        if: ${{ inputs.run_migrations }}
        # Error text is echoed as an annotation so it shows in the run summary
        # (and via the API) without opening the raw log.
        run: |
          if ! npx wrangler d1 migrations apply gchp --remote > /tmp/migrate.txt 2>&1; then
            cat /tmp/migrate.txt
            echo "::error title=D1 migration failed::$(grep -v '^$' /tmp/migrate.txt | tail -c 900 | tr '\n' ' ')"
            exit 1
          fi
          cat /tmp/migrate.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run build
      - name: Deploy
        run: npx wrangler pages deploy dist --project-name gchp-site --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
